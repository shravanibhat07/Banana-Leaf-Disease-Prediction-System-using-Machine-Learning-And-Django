<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #d4fc79, #96e6a1);
            text-align: center;
            padding: 50px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
            width: 400px;
            margin: auto;
        }

        h2 {
            color: #2e7d32;
        }

        .result {
            font-size: 20px;
            margin: 15px 0;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        .btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover {
            background: #1b5e20;
        }
    </style>
</head>

<body>

<div class="card">

    <h2> Banana Leaf Disease Result</h2>

    {% if error %}
        <p class="error">⚠️ Error: {{ error }}</p>
    {% else %}
        <p class="result"><b> Prediction:</b> {{ prediction }}</p>
        <p class="result"><b>Accuracy:</b> {{ accuracy }}</p>
        <p class="result"><b>Best Model:</b> {{ best_model }}</p>
    {% endif %}

    <a href="/predict/">
        <button class="btn">🔄 Try Again</button>
    </a>

</div>

</body>
</html>
